<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bucket List">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E7EAE2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151A16" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<title>Bucket List</title>
<style>
:root{
  --paper:#E7EAE2;
  --paper-2:#F1F3EC;
  --ink:#18261E;
  --ink-soft:#5D6B60;
  --ink-faint:#8B968C;
  --rule:#CBD1C2;
  --accent:#2E6B4A;
  --accent-soft:#DCE7DC;
  --gold:#9A7A22;
  --warn:#A6423A;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#151A16;
    --paper-2:#1D231E;
    --ink:#E4E9E0;
    --ink-soft:#9AA79C;
    --ink-faint:#6D7A70;
    --rule:#2C352E;
    --accent:#69B389;
    --accent-soft:#233329;
    --gold:#C9A94E;
    --warn:#D98E85;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font:17px/1.5 -apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#app{max-width:34rem;margin:0 auto;padding:1.5rem 1.25rem 5rem}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}

/* ---------- Anmeldung ---------- */
.login{max-width:20rem;margin:18vh auto 0;text-align:left}
.login h1{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  font-size:1.75rem;font-weight:400;margin:0 0 .375rem}
.login p{color:var(--ink-soft);font-size:.9375rem;margin:0 0 1.75rem}
.login input{
  display:block;width:100%;padding:.8125rem .875rem;margin-bottom:.625rem;
  background:var(--paper-2);border:1px solid var(--rule);border-radius:10px;
}
.login button{
  width:100%;padding:.8125rem;background:var(--accent);color:var(--paper);
  border-radius:10px;font-weight:600;margin-top:.375rem;
}
.login button:disabled{opacity:.5}
.fehler{color:var(--warn);font-size:.875rem;margin:.75rem 0 0;min-height:1.25rem}
.laedt{color:var(--ink-faint);font-size:.9375rem;margin:18vh 0 0;text-align:center}

/* ---------- Kopfzeile ---------- */
.kopf{margin:0 0 1.75rem}
.kopf h1{font-size:.8125rem;font-weight:600;letter-spacing:.02em;color:var(--ink-faint);margin:0 0 .5rem}
.stand{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:1.25rem;line-height:1.35;margin:0;color:var(--ink-soft)}
.stand b{color:var(--ink);font-weight:600}
.offline{font-size:.8125rem;color:var(--gold);margin:.625rem 0 0}

/* ---------- Zielliste ---------- */
.ziel{
  display:flex;gap:.875rem;align-items:flex-start;width:100%;text-align:left;
  padding:1.0625rem 0;border-top:1px solid var(--rule);
}
.ziel:first-of-type{border-top:0}
.ziel .emoji{font-size:1.375rem;line-height:1.4;flex:none;width:1.75rem}
.ziel .mitte{flex:1;min-width:0}
.ziel .titel{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:1.1875rem;line-height:1.3;display:block}
.punkte{display:flex;gap:.28rem;align-items:center;margin-top:.5rem;flex-wrap:wrap}
.punkt{width:6px;height:6px;border-radius:50%;background:var(--rule)}
.punkt.voll{background:var(--accent)}
.zaehler{font-size:.8125rem;color:var(--ink-faint);margin-left:.375rem;font-variant-numeric:tabular-nums}
.keine-schritte{font-size:.8125rem;color:var(--ink-faint);margin-top:.5rem;display:block}

.neu-btn{
  display:block;width:100%;text-align:left;padding:1.0625rem 0 0 2.625rem;
  border-top:1px solid var(--rule);color:var(--ink-soft);font-size:.9375rem;
}
.neu-btn:active{color:var(--accent)}
.leer{color:var(--ink-faint);font-size:.9375rem;padding:0 0 1.0625rem}

/* ---------- Erreicht ---------- */
.abschnitt{margin-top:2.75rem;padding-top:1.25rem;border-top:2px solid var(--rule)}
.abschnitt h2{font-size:.8125rem;font-weight:600;color:var(--ink-faint);margin:0 0 .25rem}
.erreicht-zeile{display:flex;gap:.875rem;width:100%;text-align:left;padding:.8125rem 0;align-items:baseline}
.erreicht-zeile .emoji{opacity:.55;width:1.75rem;flex:none}
.erreicht-zeile .titel{font-family:"Iowan Old Style",Palatino,Georgia,serif;flex:1;color:var(--ink-soft)}
.erreicht-zeile .datum{font-size:.8125rem;color:var(--gold);font-variant-numeric:tabular-nums;flex:none}

.abmelden{margin-top:3rem;font-size:.875rem;color:var(--ink-faint);padding:.625rem 0}

/* ---------- Detail ---------- */
.zurueck{color:var(--ink-soft);font-size:.9375rem;margin-bottom:1.5rem;display:block;padding:.25rem 0}
.d-kopf{display:flex;gap:.875rem;align-items:flex-start;margin-bottom:.25rem}
.d-emoji{font-size:1.75rem;line-height:1.2;flex:none;padding:0 .125rem;border-radius:8px}
.d-emoji:active{background:var(--accent-soft)}
.d-titel{
  font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:1.75rem;line-height:1.25;
  font-weight:400;margin:0;flex:1;border:0;background:none;padding:0;width:100%;resize:none;overflow:hidden;
}
.d-notiz{
  color:var(--ink-soft);font-size:.9375rem;margin:.75rem 0 0;width:100%;border:0;background:none;
  padding:0;resize:none;overflow:hidden;line-height:1.55;font-family:inherit;
}
.d-notiz::placeholder,.d-titel::placeholder{color:var(--ink-faint)}
.emoji-wahl{display:flex;flex-wrap:wrap;gap:.25rem;margin:.875rem 0 0}
.emoji-wahl button{font-size:1.375rem;padding:.375rem;border-radius:8px;line-height:1}
.emoji-wahl button:active{background:var(--accent-soft)}

.schritte{margin-top:2rem;border-top:1px solid var(--rule)}
.schritt{display:flex;gap:.8125rem;align-items:baseline;padding:.9375rem 0;border-bottom:1px solid var(--rule)}
.kreis{
  flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--ink-faint);
  position:relative;top:4px;transition:background .18s ease,border-color .18s ease,transform .18s ease;
}
.kreis:active{transform:scale(.88)}
.schritt.fertig .kreis{background:var(--accent);border-color:var(--accent)}
.kreis svg{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .18s ease .04s}
.schritt.fertig .kreis svg{opacity:1}
.s-titel{flex:1;line-height:1.4;font-size:1rem}
.schritt.fertig .s-titel{color:var(--ink-soft)}
.s-datum{
  flex:none;font-size:.8125rem;color:var(--accent);font-variant-numeric:tabular-nums;
  padding:.25rem .375rem;margin:-.25rem -.375rem;border-radius:5px;
}
.s-datum:active{background:var(--accent-soft)}
.s-datum input{border:0;background:var(--accent-soft);border-radius:5px;padding:.125rem .25rem;font-size:.8125rem}
.s-weg{flex:none;color:var(--ink-faint);font-size:1.125rem;padding:0 .25rem;line-height:1}
.trenner{padding:1.5rem 0 .5rem;font-size:.8125rem;color:var(--ink-faint)}
.zufuegen{display:flex;gap:.8125rem;align-items:center;padding:.9375rem 0;border-bottom:1px solid var(--rule)}
.zufuegen .kreis{border-style:dashed;border-color:var(--rule);top:0}
.zufuegen input{flex:1;border:0;background:none;padding:0;font-size:1rem;min-width:0}
.zufuegen input::placeholder{color:var(--ink-faint)}

.fuss{margin-top:2.5rem;display:flex;flex-direction:column;gap:.25rem;align-items:flex-start}
.fuss button{font-size:.9375rem;color:var(--ink-soft);padding:.625rem 0}
.fuss .erreicht-btn{color:var(--accent);font-weight:500}
.fuss .loeschen{color:var(--warn)}
.siegel{display:inline-flex;align-items:baseline;gap:.5rem;margin-top:.75rem;color:var(--gold);font-size:.875rem}

/* ---------- Toast ---------- */
#toast{
  position:fixed;left:50%;transform:translateX(-50%) translateY(1rem);
  bottom:calc(1.5rem + env(safe-area-inset-bottom));
  background:var(--ink);color:var(--paper);padding:.75rem 1.125rem;border-radius:11px;
  font-size:.9375rem;max-width:calc(100% - 2.5rem);display:flex;gap:.875rem;align-items:center;
  opacity:0;pointer-events:none;transition:opacity .22s ease,transform .22s ease;z-index:20;
}
#toast.an{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#toast button{color:var(--accent);font-weight:600;flex:none}
@media (prefers-color-scheme: dark){#toast button{color:#8ED0A9}}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
</style>
</head>
<body>
<div id="app"><p class="laedt">Einen Moment…</p></div>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged,
         setPersistence, browserLocalPersistence }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue, set, update, remove, push }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const ROOT = 'bucketlist';

const firebaseConfig = {
  apiKey: "AIzaSyCVVXXPsxB-QUGQhDqZnkFIyPiAORyFPyE",
  authDomain: "einkaufsliste-die-suehsen.firebaseapp.com",
  databaseURL: "https://einkaufsliste-die-suehsen-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "einkaufsliste-die-suehsen",
  storageBucket: "einkaufsliste-die-suehsen.firebasestorage.app",
  messagingSenderId: "872606696030",
  appId: "1:872606696030:web:24673a3459ffc61d976acf"
};

const fbApp = initializeApp(firebaseConfig);
const auth  = getAuth(fbApp);
const db    = getDatabase(fbApp);

/* ================= Zustand ================= */
let state = {
  phase: 'laedt',          // laedt | login | app
  ansicht: 'liste',        // liste | detail
  offenesZiel: null,
  ziele: [],
  online: true,
  emojiOffen: false,
  fehler: ''
};
let uid = null;
let abmelder = null;       // Listener lösen
let tippt = false;         // Feld hat Fokus → Rerender verschieben
let nachtragen = false;

const heute = () => new Date().toISOString().slice(0,10);
const MONATE = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
function datumLang(iso){
  const d = new Date(iso+'T12:00:00');
  const jahr = d.getFullYear() === new Date().getFullYear() ? '' : ' '+d.getFullYear();
  return d.getDate()+'. '+MONATE[d.getMonth()]+jahr;
}
function datumKurz(iso){
  const d = new Date(iso+'T12:00:00');
  return d.getDate()+'.'+(d.getMonth()+1)+'.'+String(d.getFullYear()).slice(2);
}
const esc = s => String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const zielVon = id => state.ziele.find(z=>z.id===id);
const zielRef = id => ref(db, ROOT+'/'+uid+'/ziele/'+id);

const EMOJIS = ['🎯','🏔️','✈️','🏝️','🎹','🎸','📚','🏃','🚴','🛠️','🏡','🌱','🐕','👨‍👩‍👧','💼','🎓','🍳','🇯🇵','🎬','⛵'];

/* ================= Toast ================= */
let toastTimer;
function toast(text, aktion){
  const el = document.getElementById('toast');
  el.innerHTML = '<span>'+esc(text)+'</span>';
  if (aktion){
    const b = document.createElement('button');
    b.textContent = aktion.label;
    b.onclick = () => { aktion.fn(); el.classList.remove('an'); };
    el.appendChild(b);
  }
  el.classList.add('an');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('an'), aktion ? 6500 : 2600);
}

/* ================= Anmeldung ================= */
setPersistence(auth, browserLocalPersistence).catch(()=>{});

onAuthStateChanged(auth, nutzer => {
  if (abmelder){ abmelder(); abmelder = null; }
  if (nutzer){
    uid = nutzer.uid;
    state.phase = 'app';
    state.ansicht = 'liste';
    hoere();
  } else {
    uid = null;
    state.phase = 'login';
    state.ziele = [];
  }
  render();
});

function fehlerText(code){
  switch(code){
    case 'auth/invalid-email':        return 'Die E-Mail-Adresse sieht nicht richtig aus.';
    case 'auth/missing-password':     return 'Bitte gib dein Passwort ein.';
    case 'auth/invalid-credential':
    case 'auth/wrong-password':
    case 'auth/user-not-found':       return 'E-Mail oder Passwort stimmt nicht.';
    case 'auth/user-disabled':        return 'Dieser Zugang ist gesperrt.';
    case 'auth/too-many-requests':    return 'Zu viele Versuche. Warte einen Moment.';
    case 'auth/network-request-failed': return 'Keine Verbindung zum Server.';
    default: return 'Anmeldung fehlgeschlagen ('+code+').';
  }
}

/* ================= Daten ================= */
function hoere(){
  const r = ref(db, ROOT+'/'+uid+'/ziele');
  abmelder = onValue(r, snap => {
    const roh = snap.val() || {};
    state.ziele = Object.entries(roh).map(([id,z])=>({
      id,
      emoji: z.emoji || '🎯',
      titel: z.titel || '',
      notiz: z.notiz || '',
      erreichtAm: z.erreichtAm || null,
      erstelltAm: z.erstelltAm || 0,
      schritte: Object.entries(z.schritte || {}).map(([sid,s])=>({
        id: sid, titel: s.titel || '', erledigtAm: s.erledigtAm || null, erstelltAm: s.erstelltAm || 0
      })).sort((a,b)=>a.erstelltAm-b.erstelltAm)
    })).sort((a,b)=>b.erstelltAm-a.erstelltAm);
    sanftRendern();
  }, err => toast('Daten konnten nicht geladen werden.'));

  onValue(ref(db, '.info/connected'), s => {
    state.online = s.val() === true;
    sanftRendern();
  });
}

/* ================= Rendern ================= */
function sanftRendern(){
  if (tippt){ nachtragen = true; return; }
  render();
}

function render(){
  const app = document.getElementById('app');
  if (state.phase === 'laedt'){ app.innerHTML = '<p class="laedt">Einen Moment…</p>'; return; }
  if (state.phase === 'login'){ app.innerHTML = renderLogin(); bindeLogin(); return; }
  app.innerHTML = state.ansicht === 'liste' ? renderListe() : renderDetail();
  if (state.ansicht === 'detail') autoHoehe();
  binde();
}

function renderLogin(){
  return '<div class="login">'
    + '<h1>Bucket List</h1>'
    + '<p>Melde dich mit deinem Zugang an.</p>'
    + '<input id="mail" type="email" placeholder="E-Mail" autocomplete="username" inputmode="email" autocapitalize="none">'
    + '<input id="pw" type="password" placeholder="Passwort" autocomplete="current-password" enterkeyhint="go">'
    + '<button id="anmelden">Anmelden</button>'
    + '<p class="fehler">'+esc(state.fehler)+'</p>'
    + '</div>';
}

function renderListe(){
  const offen = state.ziele.filter(z=>!z.erreichtAm);
  const erreicht = state.ziele.filter(z=>z.erreichtAm)
    .sort((a,b)=>b.erreichtAm.localeCompare(a.erreichtAm));
  const letzter = state.ziele.flatMap(z=>z.schritte).filter(s=>s.erledigtAm)
    .sort((a,b)=>b.erledigtAm.localeCompare(a.erledigtAm))[0];

  let h = '<header class="kopf"><h1>Bucket List</h1><p class="stand">';
  if (!state.ziele.length){
    h += 'Noch nichts eingetragen.';
  } else if (!offen.length){
    h += '<b>Alles geschafft.</b> Zeit für etwas Neues.';
  } else {
    h += '<b>'+offen.length+(offen.length===1?' offenes Ziel.':' offene Ziele.')+'</b> ';
    h += letzter ? 'Zuletzt geschafft am '+datumLang(letzter.erledigtAm)+'.' : 'Noch kein Schritt abgehakt.';
  }
  h += '</p>';
  if (!state.online) h += '<p class="offline">Offline. Änderungen werden gesendet, sobald du wieder Netz hast.</p>';
  h += '</header>';

  if (!state.ziele.length) h += '<p class="leer">Trag ein, was du auf jeden Fall noch erreichen willst.</p>';

  h += offen.map(z=>{
    const f = z.schritte.filter(s=>s.erledigtAm).length, n = z.schritte.length;
    let fort;
    if (n === 0) fort = '<span class="keine-schritte">Keine Schritte</span>';
    else if (n <= 12) fort = '<span class="punkte">'
      + Array.from({length:n},(_,i)=>'<i class="punkt'+(i<f?' voll':'')+'"></i>').join('')
      + '<span class="zaehler">'+f+'/'+n+'</span></span>';
    else fort = '<span class="punkte"><span class="zaehler" style="margin-left:0">'+f+' von '+n+'</span></span>';
    return '<button class="ziel" data-oeffne="'+z.id+'">'
      + '<span class="emoji">'+z.emoji+'</span>'
      + '<span class="mitte"><span class="titel">'+(z.titel ? esc(z.titel) : '<span style="color:var(--ink-faint)">Ohne Titel</span>')+'</span>'+fort+'</span>'
      + '</button>';
  }).join('');

  h += '<button class="neu-btn" id="neues-ziel">Neues Ziel eintragen</button>';

  if (erreicht.length){
    h += '<section class="abschnitt"><h2>Erreicht</h2>'
      + erreicht.map(z=>'<button class="erreicht-zeile" data-oeffne="'+z.id+'">'
          + '<span class="emoji">'+z.emoji+'</span>'
          + '<span class="titel">'+esc(z.titel||'Ohne Titel')+'</span>'
          + '<span class="datum">'+datumKurz(z.erreichtAm)+'</span></button>').join('')
      + '</section>';
  }
  h += '<button class="abmelden" id="abmelden">Abmelden</button>';
  return h;
}

function renderDetail(){
  const z = zielVon(state.offenesZiel);
  if (!z){ state.ansicht='liste'; return renderListe(); }
  const offen = z.schritte.filter(s=>!s.erledigtAm);
  const erledigt = z.schritte.filter(s=>s.erledigtAm)
    .sort((a,b)=>b.erledigtAm.localeCompare(a.erledigtAm));

  const zeile = s => '<div class="schritt'+(s.erledigtAm?' fertig':'')+'">'
    + '<button class="kreis" data-hake="'+s.id+'" aria-label="'+(s.erledigtAm?'Wieder öffnen':'Als geschafft markieren')+'">'
      + '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5.5 10.2l3 3 6-6.4" stroke="var(--paper)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    + '</button>'
    + '<span class="s-titel">'+esc(s.titel)+'</span>'
    + (s.erledigtAm ? '<button class="s-datum" data-datum="'+s.id+'">'+datumKurz(s.erledigtAm)+'</button>' : '')
    + '<button class="s-weg" data-weg="'+s.id+'" aria-label="Schritt löschen">×</button>'
    + '</div>';

  let h = '<button class="zurueck" id="zurueck">‹ Alle Ziele</button>'
    + '<div class="d-kopf">'
    + '<button class="d-emoji" id="emoji-btn" aria-label="Symbol ändern">'+z.emoji+'</button>'
    + '<textarea class="d-titel" id="f-titel" rows="1" placeholder="Was willst du erreichen?">'+esc(z.titel)+'</textarea></div>';

  if (state.emojiOffen){
    h += '<div class="emoji-wahl">'+EMOJIS.map(e=>'<button data-emoji="'+e+'">'+e+'</button>').join('')+'</div>';
  }

  h += '<textarea class="d-notiz" id="f-notiz" rows="1" placeholder="Notiz">'+esc(z.notiz)+'</textarea>';
  if (z.erreichtAm) h += '<div class="siegel">Erreicht am '+datumLang(z.erreichtAm)+'</div>';

  h += '<div class="schritte">'
    + offen.map(zeile).join('')
    + '<div class="zufuegen"><span class="kreis"></span>'
      + '<input id="neuer-schritt" placeholder="Schritt hinzufügen" enterkeyhint="done" autocapitalize="sentences">'
    + '</div>'
    + (erledigt.length ? '<div class="trenner">Geschafft</div>'+erledigt.map(zeile).join('') : '')
    + '</div>';

  h += '<div class="fuss">'
    + (z.erreichtAm
        ? '<button id="wieder-offen">Doch noch offen</button>'
        : '<button class="erreicht-btn" id="ziel-erreicht">Ziel als erreicht markieren</button>')
    + '<button class="loeschen" id="ziel-loeschen">Ziel löschen</button>'
    + '</div>';
  return h;
}

function autoHoehe(){
  ['f-titel','f-notiz'].forEach(id=>{
    const el = document.getElementById(id);
    if (!el) return;
    const fit = () => { el.style.height='auto'; el.style.height = el.scrollHeight+'px'; };
    fit(); el.addEventListener('input', fit);
  });
}

/* ================= Ereignisse ================= */
function bindeLogin(){
  const mail = document.getElementById('mail');
  const pw   = document.getElementById('pw');
  const btn  = document.getElementById('anmelden');
  const los = async () => {
    state.fehler = '';
    btn.disabled = true; btn.textContent = 'Melde an…';
    try {
      await signInWithEmailAndPassword(auth, mail.value.trim(), pw.value);
    } catch(e){
      state.fehler = fehlerText(e.code || '');
      btn.disabled = false; btn.textContent = 'Anmelden';
      document.querySelector('.fehler').textContent = state.fehler;
      pw.value = '';
    }
  };
  btn.onclick = los;
  pw.onkeydown = e => { if (e.key === 'Enter') los(); };
  mail.onkeydown = e => { if (e.key === 'Enter') pw.focus(); };
}

function feldFokus(el){
  el.addEventListener('focus', ()=>{ tippt = true; });
  el.addEventListener('blur', ()=>{
    tippt = false;
    if (nachtragen){ nachtragen = false; render(); }
  });
}

function binde(){
  document.querySelectorAll('input,textarea').forEach(feldFokus);

  document.querySelectorAll('[data-oeffne]').forEach(b=>{
    b.onclick = () => { state.offenesZiel = b.dataset.oeffne; state.ansicht='detail';
      state.emojiOffen = false; window.scrollTo(0,0); render(); };
  });

  const ab = document.getElementById('abmelden');
  if (ab) ab.onclick = () => signOut(auth);

  const neu = document.getElementById('neues-ziel');
  if (neu) neu.onclick = async () => {
    const r = push(ref(db, ROOT+'/'+uid+'/ziele'));
    const z = { emoji:'🎯', titel:'', notiz:'', erreichtAm:null, erstelltAm:Date.now() };
    state.ziele.unshift({...z, id:r.key, schritte:[]});
    state.offenesZiel = r.key; state.ansicht='detail'; state.emojiOffen = false;
    render();
    const t = document.getElementById('f-titel'); if (t) t.focus();
    try { await set(r, z); } catch(e){ toast('Konnte nicht gespeichert werden.'); }
  };

  const zurueck = document.getElementById('zurueck');
  if (zurueck) zurueck.onclick = () => { speichereFelder(); state.ansicht='liste';
    state.emojiOffen=false; window.scrollTo(0,0); render(); };

  ['f-titel','f-notiz'].forEach(id=>{
    const el = document.getElementById(id);
    if (el) el.addEventListener('blur', speichereFelder);
  });

  const eb = document.getElementById('emoji-btn');
  if (eb) eb.onclick = () => { state.emojiOffen = !state.emojiOffen; render(); };
  document.querySelectorAll('[data-emoji]').forEach(b=>{
    b.onclick = () => {
      const z = zielVon(state.offenesZiel);
      z.emoji = b.dataset.emoji; state.emojiOffen = false; render();
      update(zielRef(z.id), { emoji: z.emoji });
    };
  });

  document.querySelectorAll('[data-hake]').forEach(b=>{
    b.onclick = () => {
      const z = zielVon(state.offenesZiel);
      const s = z.schritte.find(x=>x.id===b.dataset.hake);
      if (s.erledigtAm){
        s.erledigtAm = null; render();
        set(ref(db, ROOT+'/'+uid+'/ziele/'+z.id+'/schritte/'+s.id+'/erledigtAm'), null);
        return;
      }
      s.erledigtAm = heute();
      b.parentElement.classList.add('fertig');
      speichereFelder();
      set(ref(db, ROOT+'/'+uid+'/ziele/'+z.id+'/schritte/'+s.id+'/erledigtAm'), s.erledigtAm);
      setTimeout(()=>{
        render();
        if (!z.erreichtAm && z.schritte.length && z.schritte.every(x=>x.erledigtAm)){
          toast('Alle Schritte geschafft.', { label:'Ziel abschließen', fn:()=>zielAbschliessen(z) });
        }
      }, 260);
    };
  });

  document.querySelectorAll('[data-datum]').forEach(b=>{
    b.onclick = () => {
      const z = zielVon(state.offenesZiel);
      const s = z.schritte.find(x=>x.id===b.dataset.datum);
      const inp = document.createElement('input');
      inp.type='date'; inp.value=s.erledigtAm; inp.max=heute();
      b.textContent=''; b.appendChild(inp);
      tippt = true;
      inp.focus();
      if (inp.showPicker){ try{ inp.showPicker(); }catch(e){} }
      inp.onchange = () => {
        if (inp.value){
          s.erledigtAm = inp.value;
          set(ref(db, ROOT+'/'+uid+'/ziele/'+z.id+'/schritte/'+s.id+'/erledigtAm'), inp.value);
        }
        tippt = false; render();
      };
      inp.onblur = () => { tippt = false; render(); };
    };
  });

  document.querySelectorAll('[data-weg]').forEach(b=>{
    b.onclick = () => {
      const z = zielVon(state.offenesZiel);
      const s = z.schritte.find(x=>x.id===b.dataset.weg);
      z.schritte = z.schritte.filter(x=>x.id!==s.id);
      render();
      remove(ref(db, ROOT+'/'+uid+'/ziele/'+z.id+'/schritte/'+s.id));
      toast('Schritt gelöscht.', { label:'Rückgängig', fn:()=>{
        set(ref(db, ROOT+'/'+uid+'/ziele/'+z.id+'/schritte/'+s.id),
            { titel:s.titel, erledigtAm:s.erledigtAm, erstelltAm:s.erstelltAm });
      }});
    };
  });

  const ns = document.getElementById('neuer-schritt');
  if (ns) ns.onkeydown = e => {
    if (e.key !== 'Enter') return;
    const wert = ns.value.trim();
    if (!wert) return;
    const z = zielVon(state.offenesZiel);
    speichereFelder();
    const r = push(ref(db, ROOT+'/'+uid+'/ziele/'+z.id+'/schritte'));
    const s = { titel:wert, erledigtAm:null, erstelltAm:Date.now() };
    z.schritte.push({...s, id:r.key});
    ns.value = '';
    render();
    const feld = document.getElementById('neuer-schritt');
    if (feld) feld.focus();
    set(r, s).catch(()=>toast('Schritt konnte nicht gespeichert werden.'));
  };

  const fertigBtn = document.getElementById('ziel-erreicht');
  if (fertigBtn) fertigBtn.onclick = () => zielAbschliessen(zielVon(state.offenesZiel));

  const wieder = document.getElementById('wieder-offen');
  if (wieder) wieder.onclick = () => {
    const z = zielVon(state.offenesZiel);
    z.erreichtAm = null; render();
    set(ref(db, ROOT+'/'+uid+'/ziele/'+z.id+'/erreichtAm'), null);
  };

  const del = document.getElementById('ziel-loeschen');
  if (del) del.onclick = () => {
    if (!del.dataset.sicher){
      del.dataset.sicher = '1';
      del.textContent = 'Wirklich löschen?';
      setTimeout(()=>{ if(del.isConnected){ del.dataset.sicher=''; del.textContent='Ziel löschen'; } }, 4000);
      return;
    }
    const z = zielVon(state.offenesZiel);
    const kopie = {
      emoji:z.emoji, titel:z.titel, notiz:z.notiz, erreichtAm:z.erreichtAm, erstelltAm:z.erstelltAm,
      schritte: Object.fromEntries(z.schritte.map(s=>[s.id,{titel:s.titel,erledigtAm:s.erledigtAm,erstelltAm:s.erstelltAm}]))
    };
    state.ziele = state.ziele.filter(x=>x.id!==z.id);
    state.ansicht='liste'; render();
    remove(zielRef(z.id));
    toast('Ziel gelöscht.', { label:'Rückgängig', fn:()=>set(zielRef(z.id), kopie) });
  };
}

function zielAbschliessen(z){
  speichereFelder();
  z.erreichtAm = heute();
  state.ansicht='liste'; state.emojiOffen=false; window.scrollTo(0,0); render();
  set(ref(db, ROOT+'/'+uid+'/ziele/'+z.id+'/erreichtAm'), z.erreichtAm);
  toast('Geschafft: '+(z.titel||'Ziel'));
}

function speichereFelder(){
  if (state.phase !== 'app' || state.ansicht !== 'detail') return;
  const z = zielVon(state.offenesZiel);
  if (!z) return;
  const t = document.getElementById('f-titel');
  const n = document.getElementById('f-notiz');
  if (!t || !n) return;
  const neuT = t.value.trim(), neuN = n.value.trim();
  if (neuT === z.titel && neuN === z.notiz) return;
  z.titel = neuT; z.notiz = neuN;
  update(zielRef(z.id), { titel:neuT, notiz:neuN }).catch(()=>toast('Konnte nicht gespeichert werden.'));
}

window.addEventListener('pagehide', speichereFelder);
</script>
</body>
</html>
